name: Compile and Create Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Create Production Environment File
        run: |
          echo "VITE_API_BASE=${{ vars.VITE_API_BASE }}" > .env.production
          echo "VITE_BOT_BASE=${{ vars.VITE_BOT_BASE }}" >> .env.production
          echo "VITE_CLUSTER_SECRET=${{ secrets.VITE_CLUSTER_SECRET }}" >> .env.production

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Zip the Build Folder
        run: |
          zip -r website-build.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.0.${{ github.run_number }}"
          name: "Production Build V0.0.${{ github.run_number }}"
          body: |
            Automated production build for commit ${{ github.sha }}.
            Download the `website-build.zip` below and extract it into your Nginx directory.
          draft: false
          prerelease: false
          files: website-build.zip
